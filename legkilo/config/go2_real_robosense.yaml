root_dir: /home/alex/others/unitree_ws/slam/Leg-KILO

mode: "slam" # 默认 slam, odom_only(允许里程计/path/tf，不发布点云和保存点云)

#################### Topics
lidar_topic: /rslidar_points
imu_topic: /imu
kinematic_topic: /leg_sensor
kinematic_type: go2_driver::msg::LegSensor

path_max_size: 0 # 限制 /path 中保留的位姿数量，默认1000，-1 时无限，避免长时间运行后 path 消息持续膨胀

# dense cloud
pub_dense_cloud_enable: true # 仅新增 /cloud_registered_dense 可视化输出，不参与匹配/建图
pub_dense_cloud_voxel_size: 0.2 # 仅用于 /cloud_registered_dense，可设 0 关闭可视化降采样

# camera_init -> base_footprint
pub_tf_enable: false

# joint
pub_joint_tf_enable: false

# KI Options
only_imu_use: false # True: use IMU from <sensor_msgs::Imu>, without kinematics
                                          # False: use IMU and Kin. from <unitree_legged_msgs/HighState>
redundancy: false # set true for legkilo dataset 
                                     # (imu/kin publish freq is 500 hz but update freq is only 50 hz )
dynamic_time_adjust_enable: false

# Initialization
init_time: 0.05
gravity: 9.81                

# Extrinsic (Transformation  from IMU coordinate  to Lidar coordinate)
extrinsic_T: [0.171, 0.0, 0.0908]
extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# Lidar Common
lidar_type: 4   # Velodyne: 1 Ouster: 2 Hesai: 3 Robosense: 4, UTLidar: 5
time_scale: 1e-9 # point sampling time scale relative to [sec]
blind: 3.0
filter_num: 3
point_stamp_correct: true  # Set true for legkilo dataset
                                                         # (lidar timestamp is the end time of scan)
voxel_grid_resolution: 0.5

# Voxel Map
pub_plane_en: false
max_layer: 2
voxel_size: 0.5
min_eigen_value: 0.01
sigma_num: 3
beam_err: 0.2
dept_err: 0.04
layer_init_num: [5, 5, 5, 5, 5]
max_points_num: 30 # 50 进一步限制单体素保留点数，降低 temp_points_ 与平面缓存的常驻占用 
map_sliding_en: true # 修改说明：当前已切回 slam；必须显式开启滑窗，否则 half_map_size/sliding_thresh 不生效
                     #  slam 按配置执行；odom_only 下会强制开启局部滑窗，避免体素地图持续涨内存
half_map_size: 20 # 40 体素尺寸 0.5m 时约保留机器人周围 ±20m 地图，避免 ±50m 窗口过大
sliding_thresh: 1.0 # 2.0 每移动约 1m 触发一次滑窗清理，减少旧体素滞留

# Kinematic/imu
leg_offset_x: 0.1934
leg_offset_y: 0.0465
leg_calf_length: 0.213
leg_thigh_length: 0.213
leg_thigh_offset: 0.0465
# contact_force_threshold_up: 40
contact_force_threshold_up: 38.79
contact_force_threshold_down: 60

satu_acc: 35
satu_gyr: 30

# Eskf cov/noise
vel_process_cov: 20
imu_acc_process_cov: 500
imu_gyr_process_cov: 1000
contact_process_cov: 20
acc_bias_process_cov: 0.001
gyr_bias_process_cov: 0.001
kin_bias_process_cov: 0.001

imu_acc_meas_noise: 0.01
imu_acc_z_meas_noise: 0.1
imu_gyr_meas_noise: 0.001
kin_meas_noise: 0.1
chd_meas_noise: 0.1
contact_meas_noise: 0.001
lidar_point_meas_ratio: 10

# vis
save_traj_enable: false
save_pcd_enable: false
pcd_frames_per_file: 100
pcd_voxel_leaf_size: 0.1
